<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESPORTES 🏃‍♂️‍➡️</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>ESPORTES 🏃‍♂️‍➡️</h1>
        <p class="subtitle">API sobre esportes</p>

        <div class="sports-area">
            <img src="" alt="Esporte" id="sportsImage">
            <div id="sportsName"></div>
        </div>

        <div class="controls">
            <button id="randomBtn">🎲 Esporte aleatorio</button>
        </div>

        <div class="search">
            <input
                type="text"
                id="sportsInput"
                placeholder="Digite um esporte (ex: futebol, basquete, volei...)"
            >
            <button id="searchBtn">🔍 Buscar</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
